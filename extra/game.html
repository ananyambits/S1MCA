```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Catch the Target Game</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #141e30, #243b55);
            color: white;
            min-height: 100vh;
            overflow: hidden;
        }

        /* HEADER */

        .header {
            height: 80px;
            background: rgba(0, 0, 0, 0.35);
            display: flex;
            align-items: center;
            justify-content: space-around;
            backdrop-filter: blur(10px);
        }

        .stat {
            text-align: center;
        }

        .stat span {
            display: block;
            color: #aaa;
            font-size: 13px;
        }

        .stat strong {
            font-size: 25px;
        }

        /* GAME AREA */

        #gameArea {
            position: relative;
            width: 100%;
            height: calc(100vh - 80px);
            overflow: hidden;
        }

        /* TARGET */

        #target {
            width: 70px;
            height: 70px;
            background: #ff3b3b;
            border-radius: 50%;
            position: absolute;
            cursor: pointer;

            box-shadow:
                0 0 0 8px rgba(255, 59, 59, 0.2),
                0 0 30px rgba(255, 59, 59, 0.8);

            transition:
                left 0.15s,
                top 0.15s,
                transform 0.1s;
        }

        #target::before {
            content: "";
            position: absolute;
            width: 35px;
            height: 35px;
            background: white;
            border-radius: 50%;
            left: 17px;
            top: 17px;
        }

        #target::after {
            content: "";
            position: absolute;
            width: 15px;
            height: 15px;
            background: #ff3b3b;
            border-radius: 50%;
            left: 27px;
            top: 27px;
        }

        #target:active {
            transform: scale(0.85);
        }

        /* START SCREEN */

        .start-screen {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.75);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        .game-box {
            width: 90%;
            max-width: 450px;
            background: #171717;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }

        .game-box h1 {
            font-size: 40px;
            margin-bottom: 15px;
        }

        .game-box p {
            color: #aaa;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .start-btn {
            border: none;
            background: #ff3b3b;
            color: white;
            padding: 15px 35px;
            border-radius: 8px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .start-btn:hover {
            background: #e02020;
            transform: translateY(-2px);
        }

        /* GAME OVER */

        #gameOver {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.8);
            align-items: center;
            justify-content: center;
            z-index: 20;
        }

        .game-over-box {
            background: #171717;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            width: 90%;
            max-width: 400px;
        }

        .game-over-box h2 {
            font-size: 35px;
            margin-bottom: 15px;
        }

        .final-score {
            font-size: 50px;
            color: #ff3b3b;
            font-weight: bold;
            margin: 15px 0 25px;
        }

        /* RESPONSIVE */

        @media(max-width:600px) {

            .header {
                height: 70px;
            }

            #gameArea {
                height: calc(100vh - 70px);
            }

            #target {
                width: 60px;
                height: 60px;
            }

            #target::before {
                width: 30px;
                height: 30px;
                left: 15px;
                top: 15px;
            }

            #target::after {
                width: 13px;
                height: 13px;
                left: 23px;
                top: 23px;
            }

            .game-box h1 {
                font-size: 32px;
            }

        }

    </style>
</head>

<body>


<!-- =====================================================
     HEADER
===================================================== -->

<div class="header">

    <div class="stat">
        <span>SCORE</span>
        <strong id="score">0</strong>
    </div>

    <div class="stat">
        <span>TIME</span>
        <strong id="time">30</strong>
    </div>

    <div class="stat">
        <span>BEST</span>
        <strong id="best">0</strong>
    </div>

</div>


<!-- =====================================================
     GAME AREA
===================================================== -->

<div id="gameArea">

    <div id="target"></div>

</div>


<!-- =====================================================
     START SCREEN
===================================================== -->

<div class="start-screen" id="startScreen">

    <div class="game-box">

        <h1>
            🎯 Catch It!
        </h1>

        <p>
            Click the target as many times as you can
            before the 30-second timer reaches zero.
        </p>

        <button
            class="start-btn"
            onclick="startGame()"
        >
            Start Game
        </button>

    </div>

</div>


<!-- =====================================================
     GAME OVER
===================================================== -->

<div id="gameOver">

    <div class="game-over-box">

        <h2>
            ⏰ Time's Up!
        </h2>

        <p>
            Your final score
        </p>

        <div
            class="final-score"
            id="finalScore"
        >
            0
        </div>

        <button
            class="start-btn"
            onclick="restartGame()"
        >
            Play Again
        </button>

    </div>

</div>


<!-- =====================================================
     JAVASCRIPT
===================================================== -->

<script>

    let score = 0;

    let time = 30;

    let gameRunning = false;

    let timer;


    /* =====================================================
       ELEMENTS
    ===================================================== */

    const target =
        document.getElementById("target");

    const gameArea =
        document.getElementById("gameArea");

    const scoreDisplay =
        document.getElementById("score");

    const timeDisplay =
        document.getElementById("time");

    const bestDisplay =
        document.getElementById("best");


    /* =====================================================
       BEST SCORE
    ===================================================== */

    let bestScore =
        localStorage.getItem("catchBest") || 0;

    bestDisplay.textContent = bestScore;


    /* =====================================================
       RANDOM TARGET POSITION
    ===================================================== */

    function moveTarget() {

        const areaWidth =
            gameArea.clientWidth;

        const areaHeight =
            gameArea.clientHeight;

        const targetSize =
            target.offsetWidth;

        const maxX =
            areaWidth - targetSize;

        const maxY =
            areaHeight - targetSize;

        const x =
            Math.random() * maxX;

        const y =
            Math.random() * maxY;

        target.style.left =
            x + "px";

        target.style.top =
            y + "px";

    }


    /* =====================================================
       START GAME
    ===================================================== */

    function startGame() {

        score = 0;

        time = 30;

        gameRunning = true;

        scoreDisplay.textContent = score;

        timeDisplay.textContent = time;

        document
            .getElementById("startScreen")
            .style.display = "none";

        document
            .getElementById("gameOver")
            .style.display = "none";

        moveTarget();


        timer = setInterval(function() {

            time--;

            timeDisplay.textContent = time;

            if (time <= 0) {

                endGame();

            }

        }, 1000);

    }


    /* =====================================================
       TARGET CLICK
    ===================================================== */

    target.addEventListener(
        "click",
        function() {

            if (!gameRunning) {
                return;
            }

            score++;

            scoreDisplay.textContent =
                score;

            moveTarget();

        }
    );


    /* =====================================================
       END GAME
    ===================================================== */

    function endGame() {

        gameRunning = false;

        clearInterval(timer);

        document
            .getElementById("finalScore")
            .textContent = score;


        /* BEST SCORE */

        if (score > bestScore) {

            bestScore = score;

            localStorage.setItem(
                "catchBest",
                bestScore
            );

            bestDisplay.textContent =
                bestScore;

        }


        document
            .getElementById("gameOver")
            .style.display = "flex";

    }


    /* =====================================================
       RESTART
    ===================================================== */

    function restartGame() {

        document
            .getElementById("gameOver")
            .style.display = "none";

        startGame();

    }


    /* =====================================================
       INITIAL POSITION
    ===================================================== */

    moveTarget();

</script>

</body>
</html>
```
