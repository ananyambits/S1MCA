<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Realistic Snake Game</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background:
        radial-gradient(circle at 20% 10%, #28452d, transparent 30%),
        radial-gradient(circle at 80% 90%, #172d1c, transparent 35%),
        #071008;
    color: white;
    padding: 20px;
}

.game {
    width: 100%;
    max-width: 650px;
    text-align: center;
}

h1 {
    font-size: 44px;
    margin-bottom: 4px;
    color: #9cff8a;
    text-shadow: 0 0 20px rgba(111,255,99,.25);
}

.subtitle {
    color: #8c9d90;
    margin-bottom: 20px;
}

.stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    margin-bottom: 15px;
}

.stat {
    background: rgba(18, 31, 20, .9);
    border: 1px solid #304b34;
    border-radius: 13px;
    padding: 11px 5px;
}

.stat span {
    display: block;
    color: #809082;
    font-size: 10px;
    text-transform: uppercase;
    margin-bottom: 4px;
}

.stat strong {
    color: #b7ffa9;
    font-size: 20px;
}

.board-wrap {
    position: relative;
    width: 100%;
    max-width: 600px;
    aspect-ratio: 1;
    margin: auto;
    padding: 8px;
    background: #1c2b1d;
    border: 3px solid #415b3e;
    border-radius: 22px;
    box-shadow:
        0 20px 50px rgba(0,0,0,.5),
        inset 0 0 30px rgba(0,0,0,.4);
}

canvas {
    display: block;
    width: 100%;
    height: 100%;
    border-radius: 15px;
    background: #263b22;
}

.overlay {
    position: absolute;
    inset: 8px;
    border-radius: 15px;
    background: rgba(4, 9, 5, .82);
    backdrop-filter: blur(5px);
    display: flex;
    justify-content: center;
    align-items: center;
}

.overlay.hidden {
    display: none;
}

.overlay-box {
    padding: 25px;
}

.overlay-box .emoji {
    font-size: 60px;
    margin-bottom: 10px;
}

.overlay h2 {
    color: #aaff91;
    font-size: 32px;
    margin-bottom: 10px;
}

.overlay p {
    color: #a1ada4;
    line-height: 1.7;
    margin-bottom: 20px;
}

.main-button {
    border: none;
    padding: 13px 28px;
    border-radius: 30px;
    background: #7fe36c;
    color: #071008;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    transition: .2s;
}

.main-button:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 25px rgba(127,227,108,.25);
}

.controls {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-top: 16px;
}

.control {
    border: 1px solid #344d38;
    background: #152217;
    color: #c8d8cb;
    padding: 11px 20px;
    border-radius: 25px;
    cursor: pointer;
}

.control:hover {
    background: #203321;
}

.mobile-controls {
    display: none;
    width: 190px;
    margin: 18px auto 0;
    grid-template-columns: repeat(3, 58px);
    gap: 7px;
}

.mobile-controls button {
    width: 58px;
    height: 58px;
    border-radius: 15px;
    border: 1px solid #3a563d;
    background: #142117;
    color: #aaff91;
    font-size: 21px;
    cursor: pointer;
}

.up {
    grid-column: 2;
}

.left {
    grid-column: 1;
    grid-row: 2;
}

.down {
    grid-column: 2;
    grid-row: 2;
}

.right {
    grid-column: 3;
    grid-row: 2;
}

.instructions {
    color: #718174;
    font-size: 12px;
    margin-top: 15px;
    line-height: 1.7;
}

@media(max-width: 600px) {

    body {
        padding: 12px;
    }

    h1 {
        font-size: 35px;
    }

    .stats {
        gap: 6px;
    }

    .stat {
        padding: 9px 3px;
    }

    .stat strong {
        font-size: 16px;
    }

    .mobile-controls {
        display: grid;
    }
}

@media(max-width: 380px) {

    .stat span {
        font-size: 9px;
    }

    .stat strong {
        font-size: 14px;
    }
}
</style>
</head>

<body>

<div class="game">

    <h1>🐍 Wild Snake</h1>

    <p class="subtitle">
        A more natural snake experience
    </p>

    <div class="stats">

        <div class="stat">
            <span>Score</span>
            <strong id="score">0</strong>
        </div>

        <div class="stat">
            <span>Level</span>
            <strong id="level">1</strong>
        </div>

        <div class="stat">
            <span>Length</span>
            <strong id="length">4</strong>
        </div>

        <div class="stat">
            <span>Best</span>
            <strong id="best">0</strong>
        </div>

    </div>


    <div class="board-wrap">

        <canvas id="canvas" width="600" height="600"></canvas>


        <div class="overlay" id="startScreen">

            <div class="overlay-box">

                <div class="emoji">🐍</div>

                <h2>Wild Snake</h2>

                <p>
                    Guide the snake through the grass.<br>
                    Eat food and grow longer.
                </p>

                <button class="main-button" id="start">
                    ▶ Start Game
                </button>

            </div>

        </div>


        <div class="overlay hidden" id="gameOver">

            <div class="overlay-box">

                <div class="emoji">💀</div>

                <h2>Game Over</h2>

                <p>
                    Score:
                    <strong id="finalScore">0</strong>
                    <br>
                    Length:
                    <strong id="finalLength">4</strong>
                </p>

                <button class="main-button" id="again">
                    🔄 Play Again
                </button>

            </div>

        </div>

    </div>


    <div class="controls">

        <button class="control" id="pause">
            ⏸ Pause
        </button>

        <button class="control" id="restart">
            🔄 Restart
        </button>

    </div>


    <div class="mobile-controls">

        <button class="up" data-dir="up">▲</button>

        <button class="left" data-dir="left">◀</button>

        <button class="down" data-dir="down">▼</button>

        <button class="right" data-dir="right">▶</button>

    </div>


    <div class="instructions">

        <b>Controls:</b>
        Arrow Keys / WASD

        &nbsp; • &nbsp;

        <b>Pause:</b>
        Space / P

    </div>

</div>


<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const scoreText = document.getElementById("score");
const levelText = document.getElementById("level");
const lengthText = document.getElementById("length");
const bestText = document.getElementById("best");

const startScreen = document.getElementById("startScreen");
const gameOverScreen = document.getElementById("gameOver");

const startButton = document.getElementById("start");
const againButton = document.getElementById("again");

const pauseButton = document.getElementById("pause");
const restartButton = document.getElementById("restart");

const finalScore = document.getElementById("finalScore");
const finalLength = document.getElementById("finalLength");


/* =========================
   GAME SETTINGS
========================= */

const SIZE = 600;

const GRID = 30;

const CELL = SIZE / GRID;

let snake = [];

let food = {
    x: 15,
    y: 15
};

let direction = {
    x: 1,
    y: 0
};

let nextDirection = {
    x: 1,
    y: 0
};

let score = 0;

let level = 1;

let running = false;

let paused = false;

let timer = null;

let best =
    Number(localStorage.getItem("wildSnakeBest")) || 0;

bestText.textContent = best;


/* =========================
   START
========================= */

function startGame() {

    clearInterval(timer);

    snake = [

        { x: 15, y: 15 },

        { x: 14, y: 15 },

        { x: 13, y: 15 },

        { x: 12, y: 15 }

    ];

    direction = {
        x: 1,
        y: 0
    };

    nextDirection = {
        x: 1,
        y: 0
    };

    score = 0;

    level = 1;

    running = true;

    paused = false;

    scoreText.textContent = score;

    levelText.textContent = level;

    lengthText.textContent = snake.length;

    pauseButton.textContent = "⏸ Pause";

    startScreen.classList.add("hidden");

    gameOverScreen.classList.add("hidden");

    createFood();

    startLoop();

    draw();

}


/* =========================
   GAME LOOP
========================= */

function startLoop() {

    clearInterval(timer);

    const speed =
        Math.max(
            65,
            155 - ((level - 1) * 9)
        );

    timer = setInterval(update, speed);

}


/* =========================
   UPDATE
========================= */

function update() {

    if (!running || paused) {
        return;
    }

    direction = nextDirection;


    const head = {

        x: snake[0].x + direction.x,

        y: snake[0].y + direction.y

    };


    /* WALL */

    if (
        head.x < 0 ||
        head.x >= GRID ||
        head.y < 0 ||
        head.y >= GRID
    ) {

        endGame();

        return;

    }


    /* BODY COLLISION */

    for (let i = 0; i < snake.length; i++) {

        if (
            head.x === snake[i].x &&
            head.y === snake[i].y
        ) {

            endGame();

            return;

        }

    }


    snake.unshift(head);


    /* FOOD */

    if (
        head.x === food.x &&
        head.y === food.y
    ) {

        score += 10;

        scoreText.textContent = score;

        updateLevel();

        createFood();

    } else {

        snake.pop();

    }


    lengthText.textContent = snake.length;

    draw();

}


/* =========================
   FOOD
========================= */

function createFood() {

    let safe = false;

    while (!safe) {

        food = {

            x: Math.floor(Math.random() * GRID),

            y: Math.floor(Math.random() * GRID)

        };

        safe = true;

        for (const part of snake) {

            if (
                part.x === food.x &&
                part.y === food.y
            ) {

                safe = false;

                break;

            }

        }

    }

}


/* =========================
   LEVEL
========================= */

function updateLevel() {

    const newLevel =
        Math.floor(score / 50) + 1;

    if (newLevel !== level) {

        level = newLevel;

        levelText.textContent = level;

        startLoop();

    }

}


/* =========================
   DRAW WORLD
========================= */

function draw() {

    drawBackground();

    drawFood();

    drawSnake();

}


/* =========================
   GRASS BACKGROUND
========================= */

function drawBackground() {

    const gradient =
        ctx.createLinearGradient(
            0,
            0,
            0,
            SIZE
        );

    gradient.addColorStop(
        0,
        "#314a29"
    );

    gradient.addColorStop(
        1,
        "#1e321c"
    );

    ctx.fillStyle = gradient;

    ctx.fillRect(
        0,
        0,
        SIZE,
        SIZE
    );


    /* Grass patches */

    for (
        let y = 0;
        y < GRID;
        y++
    ) {

        for (
            let x = 0;
            x < GRID;
            x++
        ) {

            const random =
                (x * 17 + y * 31) % 11;

            if (random < 2) {

                ctx.strokeStyle =
                    "rgba(135,170,95,.18)";

                ctx.lineWidth = 1;

                const px =
                    x * CELL + 5;

                const py =
                    y * CELL + 19;

                ctx.beginPath();

                ctx.moveTo(px, py);

                ctx.lineTo(
                    px + 2,
                    py - 7
                );

                ctx.moveTo(
                    px + 4,
                    py
                );

                ctx.lineTo(
                    px + 7,
                    py - 5
                );

                ctx.stroke();

            }

        }

    }

}


/* =========================
   REALISTIC FOOD
========================= */

function drawFood() {

    const cx =
        food.x * CELL + CELL / 2;

    const cy =
        food.y * CELL + CELL / 2;


    /* Shadow */

    ctx.fillStyle =
        "rgba(0,0,0,.3)";

    ctx.beginPath();

    ctx.ellipse(
        cx,
        cy + 7,
        9,
        4,
        0,
        0,
        Math.PI * 2
    );

    ctx.fill();


    /* Apple */

    const appleGradient =
        ctx.createRadialGradient(
            cx - 4,
            cy - 5,
            2,
            cx,
            cy,
            12
        );

    appleGradient.addColorStop(
        0,
        "#ff8275"
    );

    appleGradient.addColorStop(
        .55,
        "#e9363e"
    );

    appleGradient.addColorStop(
        1,
        "#8e171f"
    );

    ctx.fillStyle = appleGradient;

    ctx.beginPath();

    ctx.arc(
        cx - 5,
        cy,
        7,
        0,
        Math.PI * 2
    );

    ctx.arc(
        cx + 5,
        cy,
        7,
        0,
        Math.PI * 2
    );

    ctx.fill();


    /* Stem */

    ctx.strokeStyle = "#54341f";

    ctx.lineWidth = 3;

    ctx.beginPath();

    ctx.moveTo(cx, cy - 8);

    ctx.lineTo(cx + 2, cy - 14);

    ctx.stroke();


    /* Leaf */

    ctx.fillStyle = "#7fcf52";

    ctx.beginPath();

    ctx.ellipse(
        cx + 5,
        cy - 12,
        5,
        2.5,
        -0.5,
        0,
        Math.PI * 2
    );

    ctx.fill();

}


/* =========================
   REALISTIC SNAKE
========================= */

function drawSnake() {

    /*
       Draw tail to head.
       This makes the body appear
       layered naturally.
    */

    for (
        let i = snake.length - 1;
        i >= 0;
        i--
    ) {

        const part = snake[i];

        const cx =
            part.x * CELL + CELL / 2;

        const cy =
            part.y * CELL + CELL / 2;


        const isHead = i === 0;

        const isTail =
            i === snake.length - 1;


        let radius;

        if (isHead) {

            radius = 14;

        } else if (isTail) {

            radius = 5;

        } else {

            radius =
                11 -
                (i / snake.length) * 4;

        }


        /* Shadow */

        ctx.fillStyle =
            "rgba(0,0,0,.28)";

        ctx.beginPath();

        ctx.ellipse(
            cx + 2,
            cy + 5,
            radius + 2,
            radius * .65,
            0,
            0,
            Math.PI * 2
        );

        ctx.fill();


        /* Body gradient */

        const gradient =
            ctx.createRadialGradient(
                cx - 4,
                cy - 5,
                2,
                cx,
                cy,
                radius + 5
            );

        gradient.addColorStop(
            0,
            "#a6d96a"
        );

        gradient.addColorStop(
            .35,
            "#659f43"
        );

        gradient.addColorStop(
            .75,
            "#356b32"
        );

        gradient.addColorStop(
            1,
            "#1b4225"
        );

        ctx.fillStyle = gradient;


        ctx.beginPath();

        ctx.arc(
            cx,
            cy,
            radius,
            0,
            Math.PI * 2
        );

        ctx.fill();


        /* Scale pattern */

        if (!isHead) {

            drawScales(
                cx,
                cy,
                radius,
                i
            );

        }

    }


    drawHead();

}


/* =========================
   SCALES
========================= */

function drawScales(
    cx,
    cy,
    radius,
    index
) {

    ctx.strokeStyle =
        "rgba(210,245,155,.22)";

    ctx.lineWidth = 1;


    const rows = 3;

    for (let row = 0; row < rows; row++) {

        const y =
            cy -
            radius * .55 +
            row * radius * .55;

        for (
            let col = -1;
            col <= 1;
            col++
        ) {

            const x =
                cx +
                col * radius * .65 +
                ((row % 2) * radius * .3);


            ctx.beginPath();

            ctx.arc(
                x,
                y,
                radius * .32,
                0,
                Math.PI
            );

            ctx.stroke();

        }

    }

}


/* =========================
   REALISTIC HEAD
========================= */

function drawHead() {

    const head = snake[0];

    const cx =
        head.x * CELL + CELL / 2;

    const cy =
        head.y * CELL + CELL / 2;


    /*
       Head direction angle
    */

    const angle =
        Math.atan2(
            direction.y,
            direction.x
        );


    ctx.save();

    ctx.translate(cx, cy);

    ctx.rotate(angle);


    /* Head shadow */

    ctx.fillStyle =
        "rgba(0,0,0,.3)";

    ctx.beginPath();

    ctx.ellipse(
        2,
        5,
        17,
        12,
        0,
        0,
        Math.PI * 2
    );

    ctx.fill();


    /* Head shape */

    const headGradient =
        ctx.createRadialGradient(
            -5,
            -7,
            2,
            0,
            0,
            20
        );

    headGradient.addColorStop(
        0,
        "#b6e779"
    );

    headGradient.addColorStop(
        .35,
        "#6fa84a"
    );

    headGradient.addColorStop(
        .75,
        "#376d35"
    );

    headGradient.addColorStop(
        1,
        "#173c25"
    );

    ctx.fillStyle = headGradient;


    ctx.beginPath();

    ctx.moveTo(18, 0);

    ctx.quadraticCurveTo(
        10,
        -15,
        -6,
        -13
    );

    ctx.quadraticCurveTo(
        -18,
        -11,
        -19,
        0
    );

    ctx.quadraticCurveTo(
        -18,
        11,
        -6,
        13
    );

    ctx.quadraticCurveTo(
        10,
        15,
        18,
        0
    );

    ctx.fill();


    /* Head markings */

    ctx.strokeStyle =
        "rgba(220,245,160,.3)";

    ctx.lineWidth = 2;

    ctx.beginPath();

    ctx.moveTo(-9, -9);

    ctx.lineTo(-1, 0);

    ctx.lineTo(-9, 9);

    ctx.stroke();


    /* Eyes */

    drawEye(-7, -8);

    drawEye(-7, 8);


    /* Mouth */

    ctx.strokeStyle =
        "#172619";

    ctx.lineWidth = 1.5;

    ctx.beginPath();

    ctx.moveTo(7, -5);

    ctx.quadraticCurveTo(
        13,
        0,
        7,
        5
    );

    ctx.stroke();


    /* Forked tongue */

    drawTongue();


    ctx.restore();

}


/* =========================
   EYES
========================= */

function drawEye(x, y) {

    /* Eye socket */

    ctx.fillStyle =
        "#d8df9b";

    ctx.beginPath();

    ctx.arc(
        x,
        y,
        4,
        0,
        Math.PI * 2
    );

    ctx.fill();


    /* Pupil */

    ctx.fillStyle = "#080b06";

    ctx.beginPath();

    ctx.ellipse(
        x + 1,
        y,
        1.3,
        3,
        0,
        0,
        Math.PI * 2
    );

    ctx.fill();


    /* Eye shine */

    ctx.fillStyle = "white";

    ctx.beginPath();

    ctx.arc(
        x + 1,
        y - 1.5,
        .8,
        0,
        Math.PI * 2
    );

    ctx.fill();

}


/* =========================
   FORKED TONGUE
========================= */

function drawTongue() {

    ctx.strokeStyle =
        "#e86a6a";

    ctx.lineWidth = 1.5;

    ctx.beginPath();

    ctx.moveTo(16, 0);

    ctx.lineTo(27, 0);

    ctx.stroke();


    ctx.beginPath();

    ctx.moveTo(27, 0);

    ctx.lineTo(33, -4);

    ctx.stroke();


    ctx.beginPath();

    ctx.moveTo(27, 0);

    ctx.lineTo(33, 4);

    ctx.stroke();

}


/* =========================
   DIRECTION
========================= */

function changeDirection(dx, dy) {

    if (!running || paused) {
        return;
    }


    /*
       Prevent immediate reverse.
    */

    if (
        dx === -direction.x &&
        dy === -direction.y
    ) {

        return;

    }


    nextDirection = {
        x: dx,
        y: dy
    };

}


/* =========================
   KEYBOARD
========================= */

document.addEventListener(
    "keydown",
    function(event) {

        const key =
            event.key.toLowerCase();


        if (
            key === "arrowup" ||
            key === "w"
        ) {

            event.preventDefault();

            changeDirection(0, -1);

        }


        else if (
            key === "arrowdown" ||
            key === "s"
        ) {

            event.preventDefault();

            changeDirection(0, 1);

        }


        else if (
            key === "arrowleft" ||
            key === "a"
        ) {

            event.preventDefault();

            changeDirection(-1, 0);

        }


        else if (
            key === "arrowright" ||
            key === "d"
        ) {

            event.preventDefault();

            changeDirection(1, 0);

        }


        else if (
            key === " " ||
            key === "p"
        ) {

            event.preventDefault();

            togglePause();

        }

    }
);


/* =========================
   MOBILE CONTROLS
========================= */

document
.querySelectorAll(".mobile-controls button")
.forEach(button => {

    button.addEventListener(
        "click",
        function() {

            const dir =
                this.dataset.dir;


            if (dir === "up") {

                changeDirection(0, -1);

            }

            if (dir === "down") {

                changeDirection(0, 1);

            }

            if (dir === "left") {

                changeDirection(-1, 0);

            }

            if (dir === "right") {

                changeDirection(1, 0);

            }

        }
    );

});


/* =========================
   PAUSE
========================= */

function togglePause() {

    if (!running) {
        return;
    }

    paused = !paused;

    pauseButton.textContent =
        paused
            ? "▶ Resume"
            : "⏸ Pause";

}


/* =========================
   GAME OVER
========================= */

function endGame() {

    clearInterval(timer);

    running = false;

    finalScore.textContent = score;

    finalLength.textContent =
        snake.length;


    if (score > best) {

        best = score;

        localStorage.setItem(
            "wildSnakeBest",
            best
        );

        bestText.textContent = best;

    }


    gameOverScreen.classList.remove(
        "hidden"
    );

}


/* =========================
   BUTTONS
========================= */

startButton.addEventListener(
    "click",
    startGame
);

againButton.addEventListener(
    "click",
    startGame
);

restartButton.addEventListener(
    "click",
    startGame
);

pauseButton.addEventListener(
    "click",
    togglePause
);


/* =========================
   INITIAL BOARD
========================= */

function initialBoard() {

    const gradient =
        ctx.createLinearGradient(
            0,
            0,
            0,
            SIZE
        );

    gradient.addColorStop(
        0,
        "#314a29"
    );

    gradient.addColorStop(
        1,
        "#1e321c"
    );

    ctx.fillStyle = gradient;

    ctx.fillRect(
        0,
        0,
        SIZE,
        SIZE
    );

}

initialBoard();

</script>
