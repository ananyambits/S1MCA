<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Word Search Challenge</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    min-height: 100vh;
    background:
        radial-gradient(circle at 10% 10%, #243b70, transparent 30%),
        radial-gradient(circle at 90% 90%, #44245c, transparent 30%),
        #090d18;
    color: white;
    padding: 25px 15px;
}

.game {
    width: 100%;
    max-width: 1050px;
    margin: auto;
}

/* HEADER */

.header {
    text-align: center;
    margin-bottom: 25px;
}

.header .icon {
    font-size: 45px;
    margin-bottom: 5px;
}

.header h1 {
    font-size: clamp(34px, 6vw, 55px);
    background: linear-gradient(90deg, #62e6ff, #9b7cff, #ef72c7);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

.header p {
    color: #9099ad;
    margin-top: 8px;
}

/* STATS */

.stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin-bottom: 20px;
}

.stat {
    background: rgba(255,255,255,.07);
    border: 1px solid rgba(255,255,255,.1);
    border-radius: 16px;
    padding: 15px;
    text-align: center;
}

.stat span {
    display: block;
    font-size: 11px;
    text-transform: uppercase;
    color: #818ba0;
    margin-bottom: 5px;
}

.stat strong {
    font-size: 22px;
    color: #fff;
}

/* MAIN */

.main {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 300px;
    gap: 20px;
}

/* BOARD */

.board-card {
    background: rgba(255,255,255,.06);
    border: 1px solid rgba(255,255,255,.1);
    border-radius: 22px;
    padding: 20px;
    backdrop-filter: blur(10px);
}

.board-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 15px;
    gap: 10px;
}

.board-header h2 {
    font-size: 20px;
}

.difficulty {
    padding: 8px 12px;
    border-radius: 20px;
    background: #1a2033;
    border: 1px solid #303952;
    color: #cbd4e8;
    outline: none;
}

/* GRID */

.grid {
    width: min(100%, 650px);
    aspect-ratio: 1;
    margin: auto;
    display: grid;
    gap: 3px;
    user-select: none;
    touch-action: none;
}

.cell {
    min-width: 0;
    min-height: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #151b2c;
    border: 1px solid #252d45;
    border-radius: 5px;
    color: #dce5ff;
    font-size: clamp(10px, 2vw, 19px);
    font-weight: bold;
    cursor: pointer;
    transition: background .12s, transform .12s;
}

.cell:hover {
    background: #202944;
}

.cell.selected {
    background: #7058d9;
    color: white;
    transform: scale(.92);
}

.cell.found {
    background: #168c68;
    color: white;
    border-color: #39d9a6;
}

/* WORDS */

.words-card {
    background: rgba(255,255,255,.06);
    border: 1px solid rgba(255,255,255,.1);
    border-radius: 22px;
    padding: 20px;
    height: fit-content;
}

.words-card h2 {
    font-size: 20px;
    margin-bottom: 5px;
}

.words-card p {
    color: #818ba0;
    font-size: 13px;
    margin-bottom: 15px;
}

.word-list {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
}

.word {
    padding: 8px 12px;
    background: #151b2c;
    border: 1px solid #293149;
    border-radius: 20px;
    color: #dbe2f4;
    font-size: 13px;
    transition: .25s;
}

.word.found {
    background: #123e32;
    color: #64e0b2;
    border-color: #267c64;
    text-decoration: line-through;
}

/* CONTROLS */

.controls {
    display: flex;
    gap: 10px;
    margin-top: 20px;
    flex-wrap: wrap;
}

button {
    border: none;
    cursor: pointer;
    font-weight: bold;
}

.action {
    padding: 12px 18px;
    border-radius: 25px;
    color: white;
    background: #222a42;
    border: 1px solid #343e5c;
}

.action.primary {
    background: linear-gradient(135deg, #6555db, #8b57df);
}

.action:hover {
    transform: translateY(-1px);
}

/* HINT */

.hint {
    margin-top: 15px;
    padding: 12px;
    background: rgba(245,190,70,.08);
    border: 1px solid rgba(245,190,70,.2);
    border-radius: 12px;
    color: #e7c978;
    font-size: 13px;
    display: none;
}

.hint.show {
    display: block;
}

/* OVERLAY */

.overlay {
    position: fixed;
    inset: 0;
    z-index: 100;
    background: rgba(3,5,12,.85);
    backdrop-filter: blur(8px);
    display: none;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.overlay.show {
    display: flex;
}

.win-box {
    width: 100%;
    max-width: 430px;
    text-align: center;
    padding: 40px 25px;
    border-radius: 25px;
    background: linear-gradient(145deg, #171c31, #24204a);
    border: 1px solid rgba(255,255,255,.15);
    animation: pop .35s ease;
}

@keyframes pop {
    from {
        transform: scale(.7);
        opacity: 0;
    }

    to {
        transform: scale(1);
        opacity: 1;
    }
}

.trophy {
    font-size: 65px;
    margin-bottom: 10px;
}

.win-box h2 {
    font-size: 34px;
    color: #77e4ff;
    margin-bottom: 10px;
}

.win-box p {
    color: #a4adc0;
    line-height: 1.7;
    margin-bottom: 20px;
}

/* RESPONSIVE */

@media(max-width: 800px) {

    .main {
        grid-template-columns: 1fr;
    }

    .words-card {
        order: 2;
    }

}

@media(max-width: 550px) {

    body {
        padding: 15px 10px;
    }

    .stats {
        gap: 6px;
    }

    .stat {
        padding: 10px 5px;
    }

    .stat strong {
        font-size: 17px;
    }

    .stat span {
        font-size: 9px;
    }

    .board-card,
    .words-card {
        padding: 12px;
        border-radius: 17px;
    }

    .board-header {
        flex-direction: column;
        align-items: stretch;
    }

    .difficulty {
        width: 100%;
    }

}
</style>
</head>

<body>

<div class="game">

    <div class="header">

        <div class="icon">🔎</div>

        <h1>WORD SEARCH</h1>

        <p>
            Find all the hidden words before time runs out!
        </p>

    </div>


    <!-- STATS -->

    <div class="stats">

        <div class="stat">
            <span>Found</span>
            <strong id="found">0 / 8</strong>
        </div>

        <div class="stat">
            <span>Time</span>
            <strong id="time">02:00</strong>
        </div>

        <div class="stat">
            <span>Score</span>
            <strong id="score">0</strong>
        </div>

        <div class="stat">
            <span>Hints</span>
            <strong id="hints">3</strong>
        </div>

    </div>


    <div class="main">

        <!-- BOARD -->

        <div class="board-card">

            <div class="board-header">

                <h2>🧩 Find the Words</h2>

                <select
                    class="difficulty"
                    id="difficulty"
                >
                    <option value="easy">Easy • 10×10</option>
                    <option value="medium">Medium • 12×12</option>
                    <option value="hard">Hard • 15×15</option>
                </select>

            </div>

            <div
                class="grid"
                id="grid"
            ></div>


            <div class="controls">

                <button
                    class="action primary"
                    id="newGame"
                >
                    🔄 New Game
                </button>

                <button
                    class="action"
                    id="hintButton"
                >
                    💡 Hint
                </button>

                <button
                    class="action"
                    id="pauseButton"
                >
                    ⏸ Pause
                </button>

            </div>


            <div
                class="hint"
                id="hint"
            >
                💡 Hint: Start looking for
                <strong id="hintWord"></strong>.
            </div>

        </div>


        <!-- WORD LIST -->

        <div class="words-card">

            <h2>📋 Words to Find</h2>

            <p>
                Words can appear horizontally,
                vertically or diagonally.
            </p>

            <div
                class="word-list"
                id="wordList"
            ></div>

        </div>

    </div>

</div>


<!-- WIN SCREEN -->

<div
    class="overlay"
    id="overlay"
>

    <div class="win-box">

        <div class="trophy">
            🏆
        </div>

        <h2 id="resultTitle">
            Excellent!
        </h2>

        <p id="resultText">
            You found all the hidden words!
        </p>

        <button
            class="action primary"
            id="playAgain"
        >
            🎮 Play Again
        </button>

    </div>

</div>


<script>

/* ================================
   WORD DATABASE
================================ */

const WORDS = [
    "TIGER",
    "LION",
    "EAGLE",
    "SNAKE",
    "ZEBRA",
    "MONKEY",
    "PANDA",
    "WOLF",
    "ELEPHANT",
    "GIRAFFE",
    "PARROT",
    "DOLPHIN",
    "BEAR",
    "FOX",
    "HORSE"
];


/* ================================
   GAME STATE
================================ */

let size = 10;

let board = [];

let placedWords = [];

let foundWords = [];

let selectedCells = [];

let isSelecting = false;

let startCell = null;

let seconds = 120;

let score = 0;

let hints = 3;

let timer = null;

let paused = false;


/* ================================
   ELEMENTS
================================ */

const grid =
    document.getElementById("grid");

const wordList =
    document.getElementById("wordList");

const foundDisplay =
    document.getElementById("found");

const timeDisplay =
    document.getElementById("time");

const scoreDisplay =
    document.getElementById("score");

const hintDisplay =
    document.getElementById("hints");

const hintBox =
    document.getElementById("hint");

const hintWord =
    document.getElementById("hintWord");

const difficulty =
    document.getElementById("difficulty");

const overlay =
    document.getElementById("overlay");

const resultTitle =
    document.getElementById("resultTitle");

const resultText =
    document.getElementById("resultText");


/* ================================
   DIRECTIONS
================================ */

const DIRECTIONS = [

    { x: 1, y: 0 },

    { x: -1, y: 0 },

    { x: 0, y: 1 },

    { x: 0, y: -1 },

    { x: 1, y: 1 },

    { x: -1, y: -1 },

    { x: 1, y: -1 },

    { x: -1, y: 1 }

];


/* ================================
   NEW GAME
================================ */

function newGame() {

    clearInterval(timer);

    size =
        difficulty.value === "easy"
            ? 10
            : difficulty.value === "medium"
                ? 12
                : 15;

    seconds =
        difficulty.value === "easy"
            ? 120
            : difficulty.value === "medium"
                ? 150
                : 180;

    score = 0;

    hints = 3;

    paused = false;

    foundWords = [];

    selectedCells = [];

    startCell = null;

    placedWords = [];

    hintBox.classList.remove("show");

    pauseButton.textContent =
        "⏸ Pause";

    createBoard();

    chooseWords();

    placeWords();

    fillEmptyCells();

    renderBoard();

    renderWords();

    updateStats();

    startTimer();

}


/* ================================
   CREATE EMPTY BOARD
================================ */

function createBoard() {

    board = [];

    for (let y = 0; y < size; y++) {

        const row = [];

        for (let x = 0; x < size; x++) {

            row.push("");

        }

        board.push(row);

    }

}


/* ================================
   CHOOSE WORDS
================================ */

function chooseWords() {

    let count =
        difficulty.value === "easy"
            ? 8
            : difficulty.value === "medium"
                ? 10
                : 12;


    const shuffled =
        [...WORDS].sort(
            () => Math.random() - .5
        );


    placedWords =
        shuffled
            .filter(word => word.length <= size)
            .slice(0, count)
            .map(word => ({
                word,
                cells: []
            }));

}


/* ================================
   PLACE WORDS
================================ */

function placeWords() {

    placedWords.forEach(item => {

        let placed = false;

        for (
            let attempt = 0;
            attempt < 500 && !placed;
            attempt++
        ) {

            const direction =
                DIRECTIONS[
                    Math.floor(
                        Math.random() *
                        DIRECTIONS.length
                    )
                ];


            const startX =
                Math.floor(
                    Math.random() * size
                );

            const startY =
                Math.floor(
                    Math.random() * size
                );


            const endX =
                startX +
                direction.x *
                (item.word.length - 1);

            const endY =
                startY +
                direction.y *
                (item.word.length - 1);


            if (
                endX < 0 ||
                endX >= size ||
                endY < 0 ||
                endY >= size
            ) {

                continue;

            }


            let valid = true;

            const cells = [];


            for (
                let i = 0;
                i < item.word.length;
                i++
            ) {

                const x =
                    startX +
                    direction.x * i;

                const y =
                    startY +
                    direction.y * i;


                const existing =
                    board[y][x];


                if (
                    existing !== "" &&
                    existing !== item.word[i]
                ) {

                    valid = false;

                    break;

                }


                cells.push({ x, y });

            }


            if (valid) {

                cells.forEach(
                    (cell, i) => {

                        board[cell.y][cell.x] =
                            item.word[i];

                    }
                );

                item.cells = cells;

                placed = true;

            }

        }

    });

}


/* ================================
   FILL EMPTY
================================ */

function fillEmptyCells() {

    const letters =
        "ABCDEFGHIJKLMNOPQRSTUVWXYZ";


    for (let y = 0; y < size; y++) {

        for (let x = 0; x < size; x++) {

            if (board[y][x] === "") {

                board[y][x] =
                    letters[
                        Math.floor(
                            Math.random() *
                            letters.length
                        )
                    ];

            }

        }

    }

}


/* ================================
   RENDER BOARD
================================ */

function renderBoard() {

    grid.innerHTML = "";

    grid.style.gridTemplateColumns =
        `repeat(${size}, 1fr)`;


    for (let y = 0; y < size; y++) {

        for (let x = 0; x < size; x++) {

            const cell =
                document.createElement("div");

            cell.className = "cell";

            cell.textContent =
                board[y][x];

            cell.dataset.x = x;

            cell.dataset.y = y;

            grid.appendChild(cell);

        }

    }

}


/* ================================
   RENDER WORDS
================================ */

function renderWords() {

    wordList.innerHTML = "";

    placedWords.forEach(item => {

        const element =
            document.createElement("div");

        element.className = "word";

        element.textContent =
            item.word;

        element.dataset.word =
            item.word;

        wordList.appendChild(element);

    });

}


/* ================================
   CELL HELPERS
================================ */

function getCell(x, y) {

    return grid.querySelector(
        `.cell[data-x="${x}"][data-y="${y}"]`
    );

}


/* ================================
   POINTER DOWN
================================ */

grid.addEventListener(
    "pointerdown",
    function(event) {

        const cell =
            event.target.closest(".cell");

        if (!cell || paused) {
            return;
        }

        event.preventDefault();

        isSelecting = true;

        startCell = {
            x: Number(cell.dataset.x),
            y: Number(cell.dataset.y)
        };

        selectedCells = [startCell];

        updateSelection();

    }
);


/* ================================
   POINTER MOVE
================================ */

grid.addEventListener(
    "pointermove",
    function(event) {

        if (!isSelecting || paused) {
            return;
        }

        const element =
            document.elementFromPoint(
                event.clientX,
                event.clientY
            );

        const cell =
            element?.closest(".cell");

        if (!cell || !grid.contains(cell)) {
            return;
        }

        const end = {
            x: Number(cell.dataset.x),
            y: Number(cell.dataset.y)
        };

        selectedCells =
            getLine(startCell, end);

        updateSelection();

    }
);


/* ================================
   POINTER UP
================================ */

document.addEventListener(
    "pointerup",
    function() {

        if (!isSelecting) {
            return;
        }

        isSelecting = false;

        checkSelection();

    }
);


/* ================================
   GET STRAIGHT LINE
================================ */

function getLine(start, end) {

    const dx =
        end.x - start.x;

    const dy =
        end.y - start.y;


    const isHorizontal =
        dy === 0;

    const isVertical =
        dx === 0;

    const isDiagonal =
        Math.abs(dx) === Math.abs(dy);


    if (
        !isHorizontal &&
        !isVertical &&
        !isDiagonal
    ) {

        return [start];

    }


    const stepX =
        Math.sign(dx);

    const stepY =
        Math.sign(dy);


    const length =
        Math.max(
            Math.abs(dx),
            Math.abs(dy)
        );


    const cells = [];


    for (
        let i = 0;
        i <= length;
        i++
    ) {

        cells.push({

            x: start.x + stepX * i,

            y: start.y + stepY * i

        });

    }


    return cells;

}


/* ================================
   SHOW SELECTION
================================ */

function updateSelection() {

    grid
    .querySelectorAll(".cell")
    .forEach(cell => {

        cell.classList.remove(
            "selected"
        );

    });


    selectedCells.forEach(cell => {

        const element =
            getCell(
                cell.x,
                cell.y
            );

        if (element) {

            element.classList.add(
                "selected"
            );

        }

    });

}


/* ================================
   CHECK WORD
================================ */

function checkSelection() {

    if (selectedCells.length < 2) {

        clearSelection();

        return;

    }


    const selectedWord =
        selectedCells
            .map(
                cell =>
                    board[cell.y][cell.x]
            )
            .join("");


    const reversed =
        selectedWord
            .split("")
            .reverse()
            .join("");


    const match =
        placedWords.find(item =>

            !foundWords.includes(item.word) &&

            (
                item.word === selectedWord ||
                item.word === reversed
            )

        );


    if (match) {

        foundWords.push(
            match.word
        );

        score +=
            100 +
            match.word.length * 10;


        markFound(match);

        updateStats();

        if (
            foundWords.length ===
            placedWords.length
        ) {

            winGame();

        }

    }


    clearSelection();

}


/* ================================
   MARK FOUND
================================ */

function markFound(item) {

    item.cells.forEach(cell => {

        const element =
            getCell(
                cell.x,
                cell.y
            );

        if (element) {

            element.classList.remove(
                "selected"
            );

            element.classList.add(
                "found"
            );

        }

    });


    const wordElement =
        document.querySelector(
            `.word[data-word="${item.word}"]`
        );

    if (wordElement) {

        wordElement.classList.add(
            "found"
        );

    }

}


/* ================================
   CLEAR SELECTION
================================ */

function clearSelection() {

    selectedCells = [];

    grid
    .querySelectorAll(".cell.selected")
    .forEach(cell => {

        cell.classList.remove(
            "selected"
        );

    });

}


/* ================================
   TIMER
================================ */

function startTimer() {

    clearInterval(timer);

    timer = setInterval(
        function() {

            if (paused) {
                return;
            }

            seconds--;

            updateStats();

            if (seconds <= 0) {

                clearInterval(timer);

                loseGame();

            }

        },
        1000
    );

}


/* ================================
   FORMAT TIME
================================ */

function formatTime(value) {

    const minutes =
        Math.floor(value / 60);

    const seconds =
        value % 60;

    return (
        String(minutes).padStart(2, "0")
        +
        ":"
        +
        String(seconds).padStart(2, "0")
    );

}


/* ================================
   STATS
================================ */

function updateStats() {

    foundDisplay.textContent =
        `${foundWords.length} / ${placedWords.length}`;

    timeDisplay.textContent =
        formatTime(Math.max(0, seconds));

    scoreDisplay.textContent =
        score;

    hintDisplay.textContent =
        hints;

}


/* ================================
   HINT
================================ */

document
.getElementById("hintButton")
.addEventListener(
    "click",
    function() {

        if (hints <= 0 || paused) {
            return;
        }


        const remaining =
            placedWords.filter(
                item =>
                    !foundWords.includes(
                        item.word
                    )
            );


        if (remaining.length === 0) {
            return;
        }


        const item =
            remaining[
                Math.floor(
                    Math.random() *
                    remaining.length
                )
            ];


        hints--;

        hintWord.textContent =
            item.word;

        hintBox.classList.add(
            "show"
        );

        updateStats();


        setTimeout(
            function() {

                hintBox.classList.remove(
                    "show"
                );

            },
            3000
        );

    }
);


/* ================================
   PAUSE
================================ */

pauseButton.addEventListener(
    "click",
    function() {

        paused = !paused;

        pauseButton.textContent =
            paused
                ? "▶ Resume"
                : "⏸ Pause";

    }
);


/* ================================
   WIN
================================ */

function winGame() {

    clearInterval(timer);

    resultTitle.textContent =
        "🎉 You Found Them All!";

    resultText.innerHTML =
        `
        Amazing work!<br>
        You found all
        <strong>${placedWords.length}</strong>
        words with a score of
        <strong>${score}</strong>.
        <br><br>
        Time remaining:
        <strong>${formatTime(seconds)}</strong>
        `;

    overlay.classList.add("show");

}


/* ================================
   LOSE
================================ */

function loseGame() {

    resultTitle.textContent =
        "⏰ Time's Up!";

    resultText.innerHTML =
        `
        The clock ran out!<br>
        You found
        <strong>${foundWords.length}</strong>
        of
        <strong>${placedWords.length}</strong>
        words.
        <br><br>
        Score:
        <strong>${score}</strong>
        `;

    overlay.classList.add("show");

}


/* ================================
   BUTTONS
================================ */

document
.getElementById("newGame")
.addEventListener(
    "click",
    newGame
);


document
.getElementById("playAgain")
.addEventListener(
    "click",
    function() {

        overlay.classList.remove(
            "show"
        );

        newGame();

    }
);


difficulty.addEventListener(
    "change",
    newGame
);


/* ================================
   START
================================ */

newGame();

</script>

</body>
</html>
