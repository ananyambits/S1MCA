<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Memory Match Game</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
    }

    body {
        min-height: 100vh;
        background:
            radial-gradient(circle at top left, #25215c, transparent 35%),
            radial-gradient(circle at bottom right, #32104f, transparent 35%),
            #080914;
        color: white;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
    }

    .game-container {
        width: 100%;
        max-width: 650px;
        text-align: center;
    }

    h1 {
        font-size: 42px;
        margin-bottom: 8px;
        background: linear-gradient(90deg, #00f2ff, #9b5cff, #ff4ecd);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
    }

    .subtitle {
        color: #aaa;
        margin-bottom: 25px;
    }

    .stats {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
        margin-bottom: 20px;
    }

    .stat {
        background: rgba(255,255,255,0.08);
        border: 1px solid rgba(255,255,255,0.12);
        padding: 14px;
        border-radius: 15px;
        backdrop-filter: blur(10px);
    }

    .stat span {
        display: block;
        color: #aaa;
        font-size: 12px;
        margin-bottom: 5px;
        text-transform: uppercase;
    }

    .stat strong {
        font-size: 22px;
    }

    .game-board {
        width: 100%;
        max-width: 560px;
        margin: auto;
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 12px;
        perspective: 1000px;
    }

    .card {
        height: 120px;
        cursor: pointer;
        position: relative;
        transform-style: preserve-3d;
        transition: transform 0.5s;
    }

    .card.flipped {
        transform: rotateY(180deg);
    }

    .card.matched {
        transform: rotateY(180deg) scale(0.95);
    }

    .card-face {
        position: absolute;
        width: 100%;
        height: 100%;
        border-radius: 16px;
        display: flex;
        justify-content: center;
        align-items: center;
        backface-visibility: hidden;
        -webkit-backface-visibility: hidden;
    }

    .card-front {
        background: linear-gradient(135deg, #15182b, #24284b);
        border: 2px solid rgba(255,255,255,0.1);
        box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        font-size: 34px;
        color: #555;
    }

    .card-front::after {
        content: "?";
        color: #777;
        font-weight: bold;
    }

    .card-back {
        transform: rotateY(180deg);
        background: linear-gradient(135deg, #00c6ff, #7b2ff7);
        font-size: 42px;
        box-shadow: 0 8px 25px rgba(0,0,0,0.4);
    }

    .card.matched .card-back {
        background: linear-gradient(135deg, #00c853, #64dd17);
    }

    .buttons {
        margin-top: 25px;
        display: flex;
        justify-content: center;
        gap: 12px;
    }

    button {
        border: none;
        padding: 13px 24px;
        border-radius: 30px;
        cursor: pointer;
        color: white;
        font-weight: bold;
        font-size: 15px;
        transition: 0.25s;
    }

    .restart {
        background: linear-gradient(135deg, #7b2ff7, #f107a3);
    }

    .restart:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 20px rgba(241,7,163,0.3);
    }

    .difficulty {
        background: rgba(255,255,255,0.1);
    }

    .message {
        margin-top: 18px;
        min-height: 25px;
        color: #bbb;
    }

    /* Win Overlay */

    .overlay {
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.8);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 100;
        padding: 20px;
    }

    .overlay.show {
        display: flex;
    }

    .win-box {
        width: 100%;
        max-width: 420px;
        padding: 40px 25px;
        text-align: center;
        border-radius: 25px;
        background: linear-gradient(145deg, #17182d, #25204b);
        border: 1px solid rgba(255,255,255,0.15);
        box-shadow: 0 20px 70px rgba(0,0,0,0.6);
        animation: popup 0.4s ease;
    }

    @keyframes popup {
        from {
            transform: scale(0.7);
            opacity: 0;
        }
        to {
            transform: scale(1);
            opacity: 1;
        }
    }

    .trophy {
        font-size: 65px;
        margin-bottom: 10px;
    }

    .win-box h2 {
        font-size: 32px;
        margin-bottom: 10px;
    }

    .win-box p {
        color: #aaa;
        line-height: 1.7;
        margin-bottom: 20px;
    }

    @media(max-width: 600px) {

        h1 {
            font-size: 32px;
        }

        .game-board {
            gap: 8px;
        }

        .card {
            height: 85px;
        }

        .card-back {
            font-size: 32px;
        }

        .stats {
            gap: 7px;
        }

        .stat {
            padding: 10px 5px;
        }

        .stat strong {
            font-size: 18px;
        }
    }

    @media(max-width: 400px) {

        .card {
            height: 72px;
        }

        .game-board {
            gap: 6px;
        }

        .card-back {
            font-size: 27px;
        }
    }
</style>
</head>

<body>

<div class="game-container">

    <h1>🧠 Memory Match</h1>
    <p class="subtitle">Find all matching pairs!</p>

    <div class="stats">

        <div class="stat">
            <span>Moves</span>
            <strong id="moves">0</strong>
        </div>

        <div class="stat">
            <span>Time</span>
            <strong id="time">00:00</strong>
        </div>

        <div class="stat">
            <span>Best</span>
            <strong id="best">--</strong>
        </div>

    </div>

    <div class="game-board" id="gameBoard"></div>

    <div class="buttons">
        <button class="restart" onclick="startGame()">
            🔄 New Game
        </button>
    </div>

    <div class="message" id="message">
        Match all the cards!
    </div>

</div>


<!-- WIN SCREEN -->

<div class="overlay" id="winOverlay">

    <div class="win-box">

        <div class="trophy">🏆</div>

        <h2>You Won!</h2>

        <p>
            Great memory! 🎉<br>
            You completed the game in
            <strong id="finalMoves">0</strong> moves
            and <strong id="finalTime">00:00</strong>.
        </p>

        <button class="restart" onclick="startGame()">
            🎮 Play Again
        </button>

    </div>

</div>


<script>

const symbols = [
    "🍕",
    "🚗",
    "🎮",
    "🐱",
    "⚽",
    "🚀",
    "🎧",
    "🔥"
];

let cards = [];
let firstCard = null;
let secondCard = null;
let lockBoard = false;

let moves = 0;
let matchedPairs = 0;

let seconds = 0;
let timer = null;

const board = document.getElementById("gameBoard");
const movesDisplay = document.getElementById("moves");
const timeDisplay = document.getElementById("time");
const bestDisplay = document.getElementById("best");
const message = document.getElementById("message");

const winOverlay = document.getElementById("winOverlay");
const finalMoves = document.getElementById("finalMoves");
const finalTime = document.getElementById("finalTime");


/* START GAME */

function startGame() {

    clearInterval(timer);

    moves = 0;
    matchedPairs = 0;
    seconds = 0;

    firstCard = null;
    secondCard = null;
    lockBoard = false;

    movesDisplay.textContent = "0";
    timeDisplay.textContent = "00:00";

    winOverlay.classList.remove("show");

    message.textContent = "Match all the cards!";

    createCards();

    startTimer();

    updateBest();
}


/* CREATE CARDS */

function createCards() {

    board.innerHTML = "";

    cards = [...symbols, ...symbols];

    shuffle(cards);

    cards.forEach((symbol, index) => {

        const card = document.createElement("div");

        card.className = "card";

        card.dataset.symbol = symbol;

        card.innerHTML = `
            <div class="card-face card-front"></div>
            <div class="card-face card-back">
                ${symbol}
            </div>
        `;

        card.addEventListener("click", () => flipCard(card));

        board.appendChild(card);

    });
}


/* SHUFFLE */

function shuffle(array) {

    for (let i = array.length - 1; i > 0; i--) {

        const j = Math.floor(Math.random() * (i + 1));

        [array[i], array[j]] =
        [array[j], array[i]];

    }

}


/* FLIP CARD */

function flipCard(card) {

    if (lockBoard) return;

    if (card === firstCard) return;

    if (card.classList.contains("matched")) return;

    card.classList.add("flipped");

    if (!firstCard) {

        firstCard = card;

        return;

    }

    secondCard = card;

    moves++;

    movesDisplay.textContent = moves;

    checkMatch();
}


/* CHECK MATCH */

function checkMatch() {

    const isMatch =
        firstCard.dataset.symbol ===
        secondCard.dataset.symbol;

    if (isMatch) {

        disableCards();

    } else {

        unflipCards();

    }

}


/* MATCH */

function disableCards() {

    firstCard.classList.add("matched");
    secondCard.classList.add("matched");

    matchedPairs++;

    resetTurn();

    message.textContent =
        "✨ Nice! You found a pair.";

    if (matchedPairs === symbols.length) {

        gameWon();

    }

}


/* NO MATCH */

function unflipCards() {

    lockBoard = true;

    message.textContent =
        "❌ Not a match. Try again!";

    setTimeout(() => {

        firstCard.classList.remove("flipped");
        secondCard.classList.remove("flipped");

        resetTurn();

    }, 800);

}


/* RESET */

function resetTurn() {

    firstCard = null;
    secondCard = null;
    lockBoard = false;

}


/* TIMER */

function startTimer() {

    timer = setInterval(() => {

        seconds++;

        const minutes =
            Math.floor(seconds / 60);

        const secs =
            seconds % 60;

        timeDisplay.textContent =
            String(minutes).padStart(2, "0")
            + ":" +
            String(secs).padStart(2, "0");

    }, 1000);

}


/* GAME WON */

function gameWon() {

    clearInterval(timer);

    finalMoves.textContent = moves;
    finalTime.textContent = timeDisplay.textContent;

    saveBest();

    setTimeout(() => {

        winOverlay.classList.add("show");

    }, 500);

}


/* BEST SCORE */

function saveBest() {

    const previous =
        localStorage.getItem("memoryBest");

    if (!previous || moves < Number(previous)) {

        localStorage.setItem(
            "memoryBest",
            moves
        );

    }

}


/* SHOW BEST */

function updateBest() {

    const best =
        localStorage.getItem("memoryBest");

    if (best) {

        bestDisplay.textContent =
            best + " moves";

    } else {

        bestDisplay.textContent = "--";

    }

}


/* INITIAL GAME */

startGame();

</script>

</body>
</html>
